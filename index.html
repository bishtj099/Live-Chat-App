<!DOCTYPE html>
<html>
<head>
  <title>Live Chat App</title>
  <style>
    body { font-family: sans-serif; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #messages { list-style-type: none; margin: 0; padding: 20px; flex: 1; overflow-y: auto; }
    #messages li { background: white; padding: 10px; margin-bottom: 10px; border-radius: 10px; width: fit-content; }
    #form { background: #f0f0f0; padding: 10px; display: flex; border-top: 1px solid #ccc; }
    #input { border: none; padding: 10px; flex: 1; border-radius: 20px; outline: none; }
    #btn { background: #075e54; color: white; border: none; padding: 10px 20px; margin-left: 5px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <ul id="messages"></ul>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Message likhein..." /><button id="btn">Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', function(msg) {
      var item = document.createElement('li');
      item.textContent = msg;
      document.getElementById('messages').appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
